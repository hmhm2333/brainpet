appId: dev.brainpet.app
productName: BrainPet
executableName: brainpet
copyright: Copyright © 2026 BrainPet contributors

files:
  - dist/**
  - pet-preload.cjs
  - brainpet-preload.cjs
  - brainpet-setup-preload.cjs
  - assets/**
  - package.json

extraMetadata:
  brainpetDistribution:
    profile: brainpet
    appId: dev.brainpet.app

extraResources:
  - from: .brainpet-package/marketplace
    to: integrations/codex/brainpet-marketplace
    filter:
      - "**/*"

asar: true
npmRebuild: false
publish: null

toolsets:
  appimage: 1.0.3

mac:
  icon: assets/app-icon.icns
  category: public.app-category.utilities
  extendInfo:
    NSMicrophoneUsageDescription: BrainPet uses your microphone only for one-shot, user-initiated voice input.
  target:
    - dmg
    - zip

win:
  icon: assets/app-icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/brainpet-installer.nsh

linux:
  icon: assets/app-icon.png
  target:
    - AppImage
    - deb
    - tar.gz
  category: Utility
  maintainer: BrainPet contributors
