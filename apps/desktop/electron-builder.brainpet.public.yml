extends: ./electron-builder.brainpet.base.yml

directories:
  output: dist-brainpet/public-release

artifactName: BrainPet-${version}-${os}-${arch}.${ext}

mac:
  hardenedRuntime: true
  gatekeeperAssess: true
  notarize: true
  target:
    - dmg

win:
  signAndEditExecutable: true
  verifyUpdateCodeSignature: true
  target:
    - nsis

nsis:
  artifactName: BrainPet-${version}-win-${arch}-setup.${ext}

linux:
  target:
    - AppImage
    - deb
