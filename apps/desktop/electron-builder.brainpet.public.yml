extends: ./electron-builder.brainpet.base.yml

directories:
  output: dist-brainpet/public-release

artifactName: BrainPet-Unsigned-${version}-${os}-${arch}.${ext}

mac:
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  target:
    - dmg

win:
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - nsis

nsis:
  artifactName: BrainPet-Unsigned-${version}-win-${arch}-setup.${ext}

linux:
  target:
    - AppImage
    - deb
