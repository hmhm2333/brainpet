@font-face{font-family:BrainPet Pixel;src:url("./FusionPixel12ProportionalSC.woff2") format("woff2");font-display:block}:root{font-family:"BrainPet Pixel","SimSun",monospace;color:#17243b;background:#d9edf0;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:linear-gradient(#9fe9ff 0 18px,#d9edf0 18px)}main{max-width:500px;margin:0 auto;border:4px solid #17243b;background:#fff7dc;box-shadow:6px 6px 0 #0d1729}header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:4px solid #17243b;background:#f5bd3d}.gem{display:grid;place-items:center;width:28px;height:28px;border:3px solid #17243b;background:#fff7dc;box-shadow:2px 2px 0 #0d1729;font-size:15px}h1{margin:0;font-size:16px;font-weight:400}section{padding:14px}h2{margin:0 0 10px;color:#237491;font-size:11px;font-weight:400;letter-spacing:.05em}ol{display:grid;gap:8px;margin:0;padding:0;list-style:none}.step{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:start;padding:9px;border:3px solid #17243b;background:#f7efd3;box-shadow:2px 2px 0 #17243b}.num{display:grid;place-items:center;width:20px;height:20px;background:#17243b;color:#fff7dc;font-size:10px}.copy strong{display:block;font-size:11px;font-weight:400}.copy span{display:block;margin-top:4px;font-size:9px;line-height:1.45;color:#3c5365}.status{padding:4px 6px;border:2px solid #17243b;background:#9fe9ff;font:inherit;font-size:8px;white-space:nowrap}.status.ready{background:#8bd07a}.status.manual{background:#f5d45f}.status.error{background:#f38b78}.status.action{cursor:pointer;box-shadow:2px 2px 0 #17243b}.status.action:active{transform:translate(2px,2px);box-shadow:none}.status:disabled{cursor:default;box-shadow:none}.recovery{display:flex;gap:10px;align-items:center;margin:0;padding:11px 14px;border-top:3px solid #17243b;background:#d9edf0;font-size:9px;line-height:1.55}.recovery p{flex:1;margin:0}.hidden{display:none}footer{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:3px solid #17243b;background:#17243b;color:#fff7dc;font-size:8px}a{color:#9fe9ff;text-decoration:none;border-bottom:1px solid currentColor}
</style></head><body><main><header><span class="gem">B</span><h1 data-i18n="title">CONNECT BRAINPET</h1></header><section><h2 data-i18n="kicker">ONE-TIME CHECK · REVERSIBLE</h2><ol><li class="step"><span class="num">1</span><span class="copy"><strong data-i18n="runtimeTitle">BrainPet runtime</strong><span data-i18n="runtimeCopy"></span></span><span id="runtime-status" class="status"></span></li><li class="step"><span class="num">2</span><span class="copy"><strong data-i18n="bridgeTitle"></strong><span id="bridge-copy" data-i18n="bridgeCopy"></span></span><button id="bridge-status" class="status manual action" type="button"></button></li><li class="step"><span class="num">3</span><span class="copy"><strong data-i18n="taskTitle"></strong><span data-i18n="taskCopy"></span></span><span id="task-status" class="status manual"></span></li></ol></section><div class="recovery"><p data-i18n="recovery"></p><button id="disconnect" class="status action hidden" type="button" data-i18n="disconnect"></button></div><footer><span data-i18n="privacy"></span><a href="https://github.com/hmhm2333/brainpet/blob/main/docs/brainpet-distribution.md" target="_blank" rel="noreferrer" data-i18n="guide"></a></footer></main>
<script nonce="brainpet-setup">
const zh=navigator.language.toLowerCase().startsWith("zh");
const text=zh?{title:"连接 BRAINPET",kicker:"一键连接 · 随时可回退",runtimeTitle:"BrainPet 运行时",runtimeCopy:"桌宠与离线训练不依赖任何 Agent。",bridgeTitle:"连接 Codex Bridge",bridgeCopy:"自动检测 Codex，并使用安装包内置的原生 Bridge 连接。",detect:"检测并连接",upgrade:"升级连接",connected:"已连接",detecting:"检测中",notFound:"未检测到 Codex",repairBundle:"安装包需修复",failed:"操作失败，可重试",taskTitle:"新建 Codex 任务",taskCopy:"新任务会请求审核生命周期 Hook；信任后即可自动唤醒 BrainPet。",verify:"待验证",verified:"已验证",recovery:"要在视觉上替代原生宠物，可先在 Codex 中收起它，之后随时恢复。卸载 Bridge 不影响离线桌宠与训练；卸载运行时后 Bridge 会静默退出。",disconnect:"卸载 Bridge",privacy:"仅本地生命周期 · 不读取提示词",guide:"完整说明",ready:"已安装",dev:"开发模式",missing:"需修复"}:{title:"CONNECT BRAINPET",kicker:"ONE CLICK · REVERSIBLE",runtimeTitle:"BrainPet runtime",runtimeCopy:"The desktop pet and offline training stay available without any Agent.",bridgeTitle:"Connect the Codex Bridge",bridgeCopy:"Detect Codex and connect the native Bridge bundled with this package.",detect:"DETECT & CONNECT",upgrade:"UPGRADE",connected:"CONNECTED",detecting:"DETECTING",notFound:"CODEX NOT FOUND",repairBundle:"REPAIR PACKAGE",failed:"FAILED · RETRY",taskTitle:"Open a new Codex task",taskCopy:"The new task asks you to review the lifecycle Hook; trust it to wake BrainPet automatically.",verify:"VERIFY",verified:"VERIFIED",recovery:"To visually replace the native pet, hide it in Codex. You can restore it at any time. Removing the Bridge keeps offline pet/training; removing the runtime makes the Bridge a silent no-op.",disconnect:"REMOVE BRIDGE",privacy:"LOCAL LIFECYCLE ONLY · NO PROMPTS",guide:"FULL GUIDE",ready:"INSTALLED",dev:"DEV MODE",missing:"REPAIR"};
for(const node of document.querySelectorAll("[data-i18n]"))node.textContent=text[node.dataset.i18n];
const query=new URLSearchParams(location.search);let setup={runtime:query.get("runtime"),nextTask:query.get("nextTask")};let adapterState=null;let busy=false;
function render(snapshot){if(snapshot.setup)setup=snapshot.setup;if(snapshot.adapter)adapterState=snapshot.adapter;const adapter=adapterState;const runtime=setup.runtime||"missing";const runtimeStatus=document.getElementById("runtime-status");runtimeStatus.textContent=runtime==="installed"?text.ready:runtime==="development"?text.dev:text.missing;runtimeStatus.classList.toggle("ready",runtime!=="missing");const bridge=document.getElementById("bridge-status");const disconnect=document.getElementById("disconnect");bridge.classList.remove("ready","error");if(!adapter){bridge.textContent=text.detecting;bridge.disabled=true;}else if(adapter.reason==="bundle-invalid"){bridge.textContent=text.repairBundle;bridge.disabled=true;bridge.classList.add("error");}else if(adapter.agent==="unavailable"){bridge.textContent=text.notFound;bridge.disabled=true;}else if(adapter.bridge==="installed"){bridge.textContent=text.connected;bridge.disabled=true;bridge.classList.add("ready");}else{bridge.textContent=adapter.bridge==="upgrade-required"?text.upgrade:text.detect;bridge.disabled=!adapter.canConnect||busy;}disconnect.classList.toggle("hidden",!adapter||adapter.bridge==="not-installed");disconnect.disabled=busy;const task=document.getElementById("task-status");task.textContent=setup.nextTask==="verified"?text.verified:text.verify;task.classList.toggle("ready",setup.nextTask==="verified");task.classList.toggle("manual",setup.nextTask!=="verified");if(snapshot.action&&!snapshot.action.ok){bridge.textContent=text.failed;bridge.disabled=busy;bridge.classList.add("error");}}
async function invoke(action){if(!window.brainpetSetup||busy)return;busy=true;render({setup,adapter:adapterState});let snapshot={setup,adapter:adapterState};try{snapshot=await action();}catch{snapshot={setup,adapter:adapterState,action:{ok:false}};}finally{busy=false;render(snapshot);}}
document.getElementById("bridge-status").addEventListener("click",()=>invoke(()=>window.brainpetSetup.connectCodex()));
document.getElementById("disconnect").addEventListener("click",()=>invoke(()=>window.brainpetSetup.disconnectCodex()));
render({setup});if(window.brainpetSetup)window.brainpetSetup.getAdapterStatus().then(render).catch(()=>render({setup,action:{ok:false}}));document.documentElement.lang=zh?"zh-Hans":"en";
</script></body></html>
