name: BrainPet portability gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "integrations/**"
      - "config/**"
      - "native/brainpet-hook/**"
      - "scripts/brainpet-**"
      - ".github/workflows/brainpet-*.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm brainpet:release:test

  native-helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, os: windows-latest, rust: x86_64-pc-windows-msvc, file: brainpet-hook.exe }
          - { id: windows-arm64, os: windows-11-arm, rust: aarch64-pc-windows-msvc, file: brainpet-hook.exe }
          - { id: macos-x64, os: macos-15-intel, rust: x86_64-apple-darwin, file: brainpet-hook }
          - { id: macos-arm64, os: macos-14, rust: aarch64-apple-darwin, file: brainpet-hook }
          - { id: linux-x64, os: ubuntu-latest, rust: x86_64-unknown-linux-gnu, file: brainpet-hook }
          - { id: linux-arm64, os: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu, file: brainpet-hook }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - run: cargo test --manifest-path native/brainpet-hook/Cargo.toml --target ${{ matrix.rust }}
      - run: cargo build --release --manifest-path native/brainpet-hook/Cargo.toml --target ${{ matrix.rust }}
      - run: node scripts/validate-native-helper.mjs ${{ matrix.id }} native/brainpet-hook/target/${{ matrix.rust }}/release/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: native/brainpet-hook/target/${{ matrix.rust }}/release/${{ matrix.file }}
          if-no-files-found: error

  runtime-package:
    needs: native-helper
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, os: windows-latest, platform: windows, arch: x64, file: brainpet-hook.exe }
          - { id: windows-arm64, os: windows-11-arm, platform: windows, arch: arm64, file: brainpet-hook.exe }
          - { id: macos-x64, os: macos-15-intel, platform: macos, arch: x64, file: brainpet-hook }
          - { id: macos-arm64, os: macos-14, platform: macos, arch: arm64, file: brainpet-hook }
          - { id: linux-x64, os: ubuntu-latest, platform: linux, arch: x64, file: brainpet-hook }
          - { id: linux-arm64, os: ubuntu-24.04-arm, platform: linux, arch: arm64, file: brainpet-hook }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @open-pets/desktop... install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: output/brainpet-helper
      - run: pnpm --filter @open-pets/desktop build
      - run: node apps/desktop/scripts/brainpet-package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --target installer --mode private-test --helper output/brainpet-helper/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-runtime-current-${{ matrix.id }}
          path: apps/desktop/dist-brainpet/private-test/
          if-no-files-found: error
      - run: node apps/desktop/scripts/brainpet-package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --target installer --mode private-test --helper output/brainpet-helper/${{ matrix.file }} --app-version 3.3.999 --output apps/desktop/dist-brainpet/upgrade-fixture-${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-upgrade-fixture-${{ matrix.id }}
          path: apps/desktop/dist-brainpet/upgrade-fixture-${{ matrix.id }}/
          if-no-files-found: error

  installer-lifecycle:
    needs: runtime-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, os: windows-latest, kind: nsis }
          - { id: macos-arm64, os: macos-14, kind: dmg }
          - { id: linux-x64, os: ubuntu-latest, kind: appimage }
          - { id: linux-x64, os: ubuntu-latest, kind: deb }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: brainpet-runtime-current-${{ matrix.id }}
          path: output/current
      - uses: actions/download-artifact@v4
        with:
          name: brainpet-upgrade-fixture-${{ matrix.id }}
          path: output/previous
      - if: runner.os == 'Linux'
        run: which xvfb-run
      - run: node apps/desktop/scripts/brainpet-package-lifecycle.mjs --target ${{ matrix.id }} --artifact-kind ${{ matrix.kind }} --current-output output/current --previous-output output/previous --receipt output/lifecycle/brainpet-install-lifecycle-receipt-${{ matrix.id }}-${{ matrix.kind }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-lifecycle-${{ matrix.id }}-${{ matrix.kind }}
          path: output/lifecycle/
          if-no-files-found: error

  assemble-bridge:
    needs: native-helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: output/brainpet-helper-artifacts
      - run: node integrations/codex/scripts/assemble-bridge-release.mjs --artifacts output/brainpet-helper-artifacts --output output/brainpet-release/brainpet-codex-bridge
      - run: node integrations/codex/scripts/validate-bridge-release.mjs --plugin-root output/brainpet-release/brainpet-codex-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-codex-bridge
          path: output/brainpet-release/brainpet-codex-bridge
          if-no-files-found: error

  aggregate-private-receipt:
    needs: [runtime-package, installer-lifecycle, assemble-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: brainpet-runtime-current-*
          path: output/packages
      - uses: actions/download-artifact@v4
        with:
          pattern: brainpet-lifecycle-*
          path: output/lifecycle
      - uses: actions/download-artifact@v4
        with:
          name: brainpet-codex-bridge
          path: output/bridge
      - run: mkdir -p output/aggregate
      - run: node scripts/aggregate-brainpet-release-receipt.mjs --packages output/packages --lifecycle output/lifecycle --bridge output/bridge --output output/aggregate/brainpet-release-receipt.json --mode private-test
      - run: node -e "const r=require('./output/aggregate/brainpet-release-receipt.json'); if(!r.rc6GatePassed||r.publicReleaseReady) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-private-release-receipt
          path: output/aggregate/brainpet-release-receipt.json
          if-no-files-found: error
