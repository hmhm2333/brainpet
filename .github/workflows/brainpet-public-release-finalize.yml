name: BrainPet public release finalize

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful BrainPet public release gate run for this exact commit
        required: true
        type: string
      physical_receipt_run_id:
        description: Successful BrainPet physical receipt intake run for this exact commit and candidate artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRAINPET_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      BRAINPET_PHYSICAL_RECEIPT_RUN_ID: ${{ inputs.physical_receipt_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: node scripts/download-brainpet-public-candidate.mjs --run-id "$BRAINPET_CANDIDATE_RUN_ID" --output output/candidate
      - run: node scripts/download-brainpet-physical-receipts.mjs --run-id "$BRAINPET_PHYSICAL_RECEIPT_RUN_ID" --candidate-receipt output/candidate/candidate-receipt/brainpet-release-receipt.json --output output/physical
      - run: mkdir -p output/final
      - run: node scripts/aggregate-brainpet-release-receipt.mjs --packages output/candidate/packages --lifecycle output/candidate/lifecycle --bridge output/candidate/bridge --physical output/physical/physical --physical-provenance output/physical/provenance --provenance output/candidate/provenance --output output/final/brainpet-release-receipt.json --mode public-release --expect-public-ready
      - run: node scripts/brainpet-sigstore-provenance.mjs --subject output/final/brainpet-release-receipt.json --output output/final/provenance
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-public-release-receipt
          path: output/final/
          if-no-files-found: error
          retention-days: 90
