name: BrainPet performance receipt intake

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful BrainPet public release gate run for the exact locally tested commit and runtime bytes
        required: true
        type: string
      receipts_gzip_base64:
        description: Gzip/base64 payload emitted by the BrainPet performance intake command
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  validate-and-seal:
    runs-on: ubuntu-latest
    environment: brainpet-physical-acceptance
    env:
      BRAINPET_PERFORMANCE_RECEIPTS_GZIP_BASE64: ${{ inputs.receipts_gzip_base64 }}
      BRAINPET_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: mkdir -p output
      - run: gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" > output/approval-history.json
      - run: node scripts/download-brainpet-public-candidate.mjs --run-id "$BRAINPET_CANDIDATE_RUN_ID" --output output/candidate
      - run: node scripts/intake-brainpet-performance-receipts.mjs --payload-env BRAINPET_PERFORMANCE_RECEIPTS_GZIP_BASE64 --candidate-receipt output/candidate/candidate-receipt/brainpet-release-receipt.json --approval-history output/approval-history.json --output output/sealed/performance --require-trusted-ci
      - run: node scripts/brainpet-sigstore-provenance.mjs --subject output/sealed/performance/brainpet-active-30m.json --subject output/sealed/performance/brainpet-idle-24h.json --subject output/sealed/performance/brainpet-performance-intake.json --output output/sealed/provenance
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-performance-receipts
          path: output/sealed/
          if-no-files-found: error
          retention-days: 90
