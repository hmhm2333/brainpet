name: BrainPet public release gate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, os: windows-latest, rust: x86_64-pc-windows-msvc, file: brainpet-hook.exe }
          - { id: windows-arm64, os: windows-11-arm, rust: aarch64-pc-windows-msvc, file: brainpet-hook.exe }
          - { id: macos-x64, os: macos-15-intel, rust: x86_64-apple-darwin, file: brainpet-hook }
          - { id: macos-arm64, os: macos-14, rust: aarch64-apple-darwin, file: brainpet-hook }
          - { id: linux-x64, os: ubuntu-latest, rust: x86_64-unknown-linux-gnu, file: brainpet-hook }
          - { id: linux-arm64, os: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu, file: brainpet-hook }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - run: cargo test --manifest-path native/brainpet-hook/Cargo.toml --target ${{ matrix.rust }}
      - run: cargo build --release --manifest-path native/brainpet-hook/Cargo.toml --target ${{ matrix.rust }}
      - run: node scripts/validate-native-helper.mjs ${{ matrix.id }} native/brainpet-hook/target/${{ matrix.rust }}/release/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-public-helper-${{ matrix.id }}
          path: native/brainpet-hook/target/${{ matrix.rust }}/release/${{ matrix.file }}
          if-no-files-found: error

  runtime-package:
    needs: native-helper
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, os: windows-latest, platform: windows, arch: x64, file: brainpet-hook.exe }
          - { id: windows-arm64, os: windows-11-arm, platform: windows, arch: arm64, file: brainpet-hook.exe }
          - { id: macos-x64, os: macos-15-intel, platform: macos, arch: x64, file: brainpet-hook }
          - { id: macos-arm64, os: macos-14, platform: macos, arch: arm64, file: brainpet-hook }
          - { id: linux-x64, os: ubuntu-latest, platform: linux, arch: x64, file: brainpet-hook }
          - { id: linux-arm64, os: ubuntu-24.04-arm, platform: linux, arch: arm64, file: brainpet-hook }
    runs-on: ${{ matrix.os }}
    # Platform publisher signing is deliberately disabled. Sigstore provenance is added later with GitHub OIDC.
    env:
      # No Authenticode credentials: Windows artifacts are intentionally unsigned.
      # No Developer ID credentials: macOS artifacts are intentionally unsigned and unnotarized.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @open-pets/desktop... install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @open-pets/desktop... rebuild esbuild get-windows sharp
      - uses: actions/download-artifact@v4
        with:
          name: brainpet-public-helper-${{ matrix.id }}
          path: output/helper
      - run: pnpm --filter @open-pets/desktop build
      - run: node apps/desktop/scripts/brainpet-package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --target installer --mode public-release --helper output/helper/${{ matrix.file }}
      - run: node scripts/stage-brainpet-package-artifacts.mjs --source apps/desktop/dist-brainpet/public-release --target ${{ matrix.id }} --output output/public-runtime-current-${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-public-runtime-current-${{ matrix.id }}
          path: output/public-runtime-current-${{ matrix.id }}/
          if-no-files-found: error
      - run: node apps/desktop/scripts/brainpet-package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --target installer --mode public-release --helper output/helper/${{ matrix.file }} --app-version 3.3.999 --output apps/desktop/dist-brainpet/public-upgrade-${{ matrix.id }}
      - run: node scripts/stage-brainpet-package-artifacts.mjs --source apps/desktop/dist-brainpet/public-upgrade-${{ matrix.id }} --target ${{ matrix.id }} --output output/lifecycle-fixture-${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-lifecycle-fixture-${{ matrix.id }}
          path: output/lifecycle-fixture-${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 1

  installer-lifecycle:
    needs: runtime-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, os: windows-latest, kind: nsis }
          - { id: macos-arm64, os: macos-14, kind: dmg }
          - { id: linux-x64, os: ubuntu-latest, kind: appimage }
          - { id: linux-x64, os: ubuntu-latest, kind: deb }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: brainpet-public-runtime-current-${{ matrix.id }}
          path: output/current
      - uses: actions/download-artifact@v4
        with:
          name: brainpet-lifecycle-fixture-${{ matrix.id }}
          path: output/previous
      - if: runner.os == 'Linux'
        run: which xvfb-run
      - run: node apps/desktop/scripts/brainpet-package-lifecycle.mjs --target ${{ matrix.id }} --artifact-kind ${{ matrix.kind }} --current-output output/current --previous-output output/previous --receipt output/lifecycle/brainpet-install-lifecycle-receipt-${{ matrix.id }}-${{ matrix.kind }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-public-lifecycle-${{ matrix.id }}-${{ matrix.kind }}
          path: output/lifecycle/
          if-no-files-found: error

  assemble-bridge:
    needs: native-helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: brainpet-public-helper-*
          path: output/helpers
      - name: Normalize helper artifact directories
        shell: bash
        run: |
          for target in windows-x64 windows-arm64 macos-x64 macos-arm64 linux-x64 linux-arm64; do
            mv "output/helpers/brainpet-public-helper-$target" "output/helpers/$target"
          done
      - run: node integrations/codex/scripts/assemble-bridge-release.mjs --artifacts output/helpers --output output/bridge
      - run: node integrations/codex/scripts/validate-bridge-release.mjs --plugin-root output/bridge
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-public-bridge
          path: output/bridge
          include-hidden-files: true
          if-no-files-found: error

  aggregate-public-candidate-receipt:
    needs: [runtime-package, installer-lifecycle, assemble-bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@v4
        with:
          pattern: brainpet-public-runtime-current-*
          path: output/packages
      - uses: actions/download-artifact@v4
        with:
          pattern: brainpet-public-lifecycle-*
          path: output/lifecycle
      - uses: actions/download-artifact@v4
        with:
          name: brainpet-public-bridge
          path: output/bridge
      - run: mkdir -p output/aggregate
      - run: node scripts/brainpet-sigstore-provenance.mjs --packages output/packages --lifecycle output/lifecycle --bridge output/bridge --output output/provenance
      - run: node scripts/aggregate-brainpet-release-receipt.mjs --packages output/packages --lifecycle output/lifecycle --bridge output/bridge --provenance output/provenance --output output/aggregate/brainpet-release-receipt.json --mode public-release
      - run: node -e "const r=require('./output/aggregate/brainpet-release-receipt.json'); const expected=['macos-arm64:physical-acceptance','performance:active-30m','performance:idle-24h','windows-x64:physical-acceptance'].sort(); if(!r.rc6GatePassed||r.publicReleaseReady||JSON.stringify([...r.missingEvidence].sort())!==JSON.stringify(expected)) process.exit(1)"
      - run: node scripts/brainpet-sigstore-provenance.mjs --subject output/aggregate/brainpet-release-receipt.json --output output/provenance
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-public-candidate-receipt
          path: output/aggregate/brainpet-release-receipt.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: brainpet-public-provenance
          path: output/provenance/
          if-no-files-found: error
          retention-days: 90
